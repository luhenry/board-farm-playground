# Bind ONLY to the K3 dongle interface.
# This solves the routing-table OFFER problem: broadcast DHCP replies would otherwise
# go out eth0 (the upstream interface) due to the default route, and the K3 would never
# see them. --bind-interfaces + --interface is the dnsmasq equivalent of SO_BINDTODEVICE.
interface=enxc84d4433b782
bind-interfaces

# DHCP pool: .18 – .30 in the 192.168.254.16/28 block, 24h leases
dhcp-range=192.168.254.18,192.168.254.30,255.255.255.240,24h

# DHCP options: gateway = Pi dongle, DNS = Cloudflare
dhcp-option=option:router,192.168.254.17
dhcp-option=option:dns-server,1.1.1.1

# Log all DHCP transactions (useful during bringup)
log-dhcp

# TFTP server — serves files from tftp-root for future PXE boot via EDK II
enable-tftp
tftp-root=/home/ubuntu/git/k3-host/tftp-root

# PXE boot file — uncomment when EDK II PXE support is in place
# dhcp-boot=grubriscv64.efi
