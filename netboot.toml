# netboot.toml — configuration for netboot.py
# Run `python netboot.py --init` to regenerate this file.

[dhcp]
# Network interface IP to bind (empty string = all interfaces / INADDR_ANY).
interface   = "192.168.1.1"
# IP address of THIS machine on the PXE network (sent as next-server / option 54 / option 66).
server_ip   = "192.168.1.1"
subnet_mask = "255.255.255.0"
router      = "192.168.1.1"
dns         = ["1.1.1.1"]
# Assignable IP pool for PXE clients.
pool_start  = "192.168.1.100"
pool_end    = "192.168.1.200"
# Lease duration in seconds (86400 = 24 h).
lease_time  = 86400
# CSV file that persists MAC→IP bindings across restarts.
lease_file  = "leases.csv"

[tftp]
# Interface for the TFTP server (0.0.0.0 = all).
interface = "192.168.1.1"
port      = 69
# Directory from which files are served.
# Typical PXE layout:
#   tftp-root/
#     pxelinux.0        (or grubx64.efi / ipxe.efi)
#     pxelinux.cfg/
#       default
#     vmlinuz           (kernel image)
#     initrd.img
root = "./tftp-root"

[pxe]
# Filename sent in DHCP option 67 (boot file name).
# Common values:
#   pxelinux.0   — SYSLINUX legacy PXE
#   grubx64.efi  — GRUB2 UEFI
#   ipxe.efi     — iPXE UEFI chainload
boot_file = "pxelinux.0"
